server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Safe default headers. NOTE: nginx quirk. If a location block uses its own add_header,
    # it throws these away. That is why the locations below use "expires" instead.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # The browser calls /api/... on the same address as the page. nginx forwards it to the backend
    # container and removes the /api prefix (the trailing slash on proxy_pass does that),
    # exactly like the Vite proxy does in development. Same origin means no CORS setup is needed.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts a hash in these file names, so a changed file gets a new name.
    # That makes it safe to cache them for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Single-page app: any other path serves index.html. Never cache it, so new deploys show up at once.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
